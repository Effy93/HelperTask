services:

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile.prod
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: