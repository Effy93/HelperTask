services:

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
   
    command: npm run dev
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile.dev
    ports:
      - "3310:3310"
    volumes:
      - ./server:/app
      # Volume nommé pour le cache
    # - backend_node_modules:/app/node_modules
    command: npm run dev
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: Tolteque42
      MYSQL_DATABASE: task_helper
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: